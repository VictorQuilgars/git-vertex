<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!-- rebase — Git Vertex icon set. Grid 24, stroke 1.7, round caps.
       Nodes are FILLED discs. An open ring of r1.9 has a 0.12px hole at the
       11px this is drawn at, so it rendered as a soft blob rather than a node
       — the ring said nothing and cost the legibility.
       EDIT THIS FILE to change the icon — components/Icon reads the folder.
       Do not put stroke-width on a shape: the component sets it, growing it
       as the icon shrinks so a 1.7 stroke never falls under a pixel. -->
  <path d="M4 15.5h16"/>
  <circle cx="7" cy="15.5" r="2.4" fill="currentColor" stroke="none"/>
  <circle cx="13" cy="15.5" r="2.4" fill="currentColor" stroke="none"/>
  <path d="M7 11.5c2-6 8-6 10 0M17 8V11.5h-3.5"/>
</svg>
