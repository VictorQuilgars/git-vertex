<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!-- rocket — the Launchpad view.

       NOT OURS. This is Lucide's `rocket`, unmodified apart from dropping the
       width/height/stroke-width the component sets itself. See THIRD-PARTY.md
       at the repository root for the ISC notice its licence requires to travel
       with every copy — that notice is the CONDITION on shipping it, so the
       file may be edited but the attribution may not be dropped.

       It is here because five of my own attempts failed and this one does not.
       Lucide's grid is 24 with round caps, the same hand as our set, and the
       drawing solves what mine could not: the counters inside the hull are
       wide, and the fins are separate closed shapes with real gaps, so nothing
       collapses when the stroke thickens at small sizes. It covers 31.4% of
       the box at 16px where my last dart covered 21.5 and my first sliver 8.2.

       Our OWN git vocabulary — commit, branch, merge, stash — stays ours and
       stays drawn to the mark. This is interface furniture, and furniture we
       do not redraw. -->
