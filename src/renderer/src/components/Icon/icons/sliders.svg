  <line x1="4" y1="8" x2="4" y2="4"/>
  <line x1="12" y1="20" x2="12" y2="12"/>
  <circle cx="12" cy="9" r="2"/>
  <line x1="12" y1="6" x2="12" y2="4"/>
  <line x1="20" y1="20" x2="20" y2="16"/>
  <circle cx="20" cy="13" r="2"/>
  <line x1="20" y1="10" x2="20" y2="4"/>
</svg>
