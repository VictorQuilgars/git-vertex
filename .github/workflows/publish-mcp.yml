name: Publish MCP to npm

# Bump the version in mcp/package.json, push to main, and this publishes.
# `paths` is that package.json alone: ordinary work under mcp/ does not start
# this workflow, and a bump of another product cannot reach it.
#
# Whether the push is a release is decided by _release-gate.yml, shared with the
# other three products — including the requirement that mcp/CHANGELOG.md carry
# an entry for the version. The release body used to be a generic blurb hard
# coded below, identical from one version to the next.
#
# Requires an NPM_TOKEN repository secret (an npm automation token with publish
# rights) — the same one publish-cli.yml uses.

on:
  push:
    branches: [main]
    paths:
      - 'mcp/package.json'
  workflow_dispatch:

permissions:
  contents: write   # to create the tag and the GitHub Release

jobs:
  gate:
    uses: ./.github/workflows/_release-gate.yml
    with:
      product: mcp

  test:
    name: Run tests
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  publish:
    name: Build & publish
    needs: [gate, test]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
        working-directory: mcp

      - run: npm run build
        working-directory: mcp

      # An npm version is immutable, so a re-run after a failure further down
      # would otherwise die here on "cannot publish over an existing version"
      # and never reach the release. Skipping what is already out makes the
      # whole job safe to re-run.
      - name: Publish to npm
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — skipping publish"
          else
            npm publish --access public
          fi

      - name: Build release notes from the changelog
        run: |
          {
            echo "## Git Vertex MCP v${VERSION}"
            echo
            bash scripts/changelog-section.sh \
              "${{ needs.gate.outputs.changelog }}" "$VERSION"
            echo
            echo "---"
            echo
            echo "Local MCP server exposing your Git repositories to AI agents (Claude Code, Cursor, Copilot…). Read-mostly, no cloud."
            echo
            echo '```'
            echo "npx git-vertex-mcp"
            echo "# or"
            echo "npm i -g git-vertex-mcp && gv-mcp"
            echo '```'
            echo
            echo "🔗 [npm](https://www.npmjs.com/package/git-vertex-mcp)"
          } > /tmp/release-notes.md

      # Creates the tag too, on the commit given by --target. --latest=false so
      # this never steals the "Latest" badge from the desktop release carrying
      # latest.yml, the feed electron-updater reads.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Git Vertex MCP v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --latest=false
