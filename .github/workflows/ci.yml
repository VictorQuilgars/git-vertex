name: CI

# Runs on every pull request. That is the only trigger, and it is enough:
# nothing reaches main except through a pull request, and these four jobs are
# main's required status checks, so no commit can land without them.
#
# It used to run on `push: branches: [main]` as well. That re-ran, on the merge
# commit, the same four jobs that had just passed on the pull request — the
# merge commit and the PR's test merge commit have the same tree, so the second
# run could only agree with the first. It cost four runners per merge to
# re-confirm a result nobody was waiting on, and nothing was gated on it: a red
# run on main blocks no merge, because the merge has already happened.
#
# The one case it did catch is the semantic conflict — two pull requests that
# are each green, merge without a textual conflict, and are broken together.
# That is covered instead by "Require branches to be up to date before merging"
# on the `protect main` ruleset: when main moves, a pull request has to take
# that move in and re-run before it can be merged, so the run that gates the
# merge is a run on the tree that merging actually produces. Catching it before
# the merge is worth more than being told after it.

on:
  pull_request:

permissions:
  contents: read

# A pull request usually gets several pushes in a row. Only the last one is
# worth a full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Desktop app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release scripts serve all four products, so this test belongs to no
      # single one of them — but it has to run inside a job that main actually
      # requires, or it could go red without blocking anything. It needs no
      # install and takes under a second, so it runs first and fails early.
      - name: Release script tests
        run: bash scripts/__tests__/promote-unreleased.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Nothing type-checked the renderer until v1.30.2, and two ReferenceErrors
      # shipped through the gap — a helper deleted in a refactor, a `t` called
      # from a component that never took it. Both are compile errors; nobody
      # could read the compiler, because one bad signature made every `t('key')`
      # call wrong (1049 of them). Now that it is at zero, it stays at zero.
      - run: npm run typecheck
      - run: npm test
      # VITE_GITHUB_CLIENT_ID / VITE_GITHUB_PROXY_URL are absent here, as they
      # are for anyone building from a fork. They only reach the bundle as
      # undefined, which breaks GitHub sign-in at runtime and nothing at build
      # time — so this still catches what it is meant to catch.
      - run: npm run build

  ext:
    name: Extension compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      # The webview bundle imports desktop sources, so the root install is not
      # optional.
      - run: npm ci
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run compile
        working-directory: vscode-extension
      # The full suite needs a display, so it stays best-effort in the publish
      # workflow. The display-free half does not, and it holds the two guards
      # that only ever fail on a pull request: host parity (is every gitAPI
      # method classified?) and panel surface (does the panel still render a
      # control for something it declared unavailable?). Running them only at
      # release time is how a red parity test shipped twice — `compile` alone
      # is not a gate. Note that src/webview is outside tsc's reach, which is
      # how 43 undefined translation keys once shipped: compiling is not the
      # same as being right.
      - name: Display-free tests (host parity, panel surface)
        run: npm run test:nodisplay
        working-directory: vscode-extension

  cli:
    name: CLI typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: npm run typecheck
        working-directory: cli

  mcp:
    name: MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
