name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tag must sit on a commit whose package.json already carries the
      # matching version — no silent injection at build time. Fail loudly
      # otherwise so a tag can never diverge from the sources it points to.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json in the release commit before tagging."
            exit 1
          fi
          echo "✓ tag v$TAG matches package.json $PKG"
      # src/main/release-notes.ts feeds the app's own "What's new" tab (shown
      # on first launch after an update) — separate from CHANGELOG.md and
      # easy to forget. Fail if this version has no entry there.
      - name: Verify in-app release notes exist
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^\s*'${TAG//./\\.}':" src/main/release-notes.ts; then
            echo "::error::No entry for version $TAG in src/main/release-notes.ts (RELEASE_NOTES). This feeds the app's in-app \"What's new\" tab — add a '$TAG': ... entry before releasing."
            exit 1
          fi
          echo "✓ src/main/release-notes.ts has an entry for $TAG"
      # Release notes come from CHANGELOG.md, never a generic placeholder — a
      # tag with no matching entry fails the release instead of shipping with
      # "Release vX.Y.Z" as its only description.
      - name: Extract changelog section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## $VERSION" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          sed -i -e '/./,$!d' /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No changelog entry found for version $VERSION in CHANGELOG.md (expected a '## $VERSION' heading with content under it). Add one before releasing."
            exit 1
          fi
          echo "Release notes for $VERSION:"
          cat /tmp/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --latest

  build-mac:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build & publish macOS
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_PROXY_URL: ${{ secrets.VITE_GITHUB_PROXY_URL }}
        run: npm run package -- --mac --publish always

  build-win:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build & publish Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_PROXY_URL: ${{ secrets.VITE_GITHUB_PROXY_URL }}
        run: npm run package -- --win --publish always

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build & publish Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_PROXY_URL: ${{ secrets.VITE_GITHUB_PROXY_URL }}
        run: npm run package -- --linux --publish always
