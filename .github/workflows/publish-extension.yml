name: Publish VS Code Extension

# Bump the version in vscode-extension/package.json, push to main, and this
# publishes. `paths` is that package.json alone: it is the only file whose
# change can be a release, so ordinary extension work does not start this
# workflow at all, and a bump of the app or the CLI cannot reach it.
#
# Whether the push is a release is decided by _release-gate.yml, shared with
# the other three products. It used to be decided here, by a copy of the same
# forty lines — and the copy that drifted is what got ext-v1.23.0 mirrored as
# the wrong release.

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/package.json'
  workflow_dispatch:

permissions:
  contents: write   # to create the tag and the GitHub Release

jobs:
  gate:
    uses: ./.github/workflows/_release-gate.yml
    with:
      product: ext

  publish:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
      # At job level rather than on each step: a step's own `env:` is visible to
      # its `if:`, but reading it from one scope makes the two guards below
      # obviously about the same value.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      # The webview bundle imports desktop sources, so the root install is not
      # optional here.
      - name: Install root dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build extension
        run: npm run compile
        working-directory: vscode-extension

      # Everything that runs in plain node — including the host-parity guard,
      # which is the only thing that catches a window.gitAPI method the panel
      # answers "not-implemented" for. This step BLOCKS: the step below cannot,
      # and a red parity test went out in two releases because of it.
      - name: Run display-free tests
        run: npm run test:nodisplay
        working-directory: vscode-extension

      - name: Run tests
        run: npm test
        working-directory: vscode-extension
        env:
          DISPLAY: ':99'
        continue-on-error: true   # VS Code's test runner needs a display; best-effort in CI

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies --out "git-vertex-${VERSION}.vsix"
        working-directory: vscode-extension

      # ── Publish to VS Code Marketplace ─────────────────────────
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          npx @vscode/vsce publish \
            --no-dependencies \
            --packagePath "git-vertex-${VERSION}.vsix"
        working-directory: vscode-extension

      # ── Publish to Open VSX (Cursor, VSCodium, Gitpod…) ────────
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "git-vertex-${VERSION}.vsix" -p "$OVSX_PAT"
        working-directory: vscode-extension

      # ── Tag + GitHub Release ───────────────────────────────────
      - name: Build release notes from the changelog
        run: |
          {
            echo "## Git Vertex VS Code Extension v${VERSION}"
            echo
            bash scripts/changelog-section.sh \
              "${{ needs.gate.outputs.changelog }}" "$VERSION"
            echo
            echo "---"
            echo
            echo "Installe le VSIX directement :"
            echo '```'
            echo "code --install-extension git-vertex-${VERSION}.vsix"
            echo '```'
            echo
            echo "Ou cherche **Git Vertex** dans le Marketplace VS Code."
            echo
            echo "🔗 [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=VictorQuilgars.git-vertex)"
            echo "🔗 [Open VSX](https://open-vsx.org/extension/VictorQuilgars/git-vertex)"
          } > /tmp/release-notes.md

      # `gh release create` creates the tag as well, on the commit given by
      # --target — so there is no separate `git tag && git push`, and no bot
      # identity to configure, in any of the four products.
      #
      # --latest=false is load-bearing: the GitHub API defaults make_latest to
      # true, so an extension release published after a desktop one would steal
      # the "Latest" badge from the release that actually carries latest.yml /
      # latest-mac.yml — the feed electron-updater reads. It happened on
      # ext-v1.20.0 (26/07/2026) and had to be undone by hand.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            "vscode-extension/git-vertex-${VERSION}.vsix" \
            --target "$GITHUB_SHA" \
            --title "Git Vertex VS Code Extension v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --latest=false
